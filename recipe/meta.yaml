{% set name = "torchtitan" %}
{% set version = "0.4.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/torchtitan-{{ version }}.tar.gz
  sha256: 6a39eacfcc613beb118668af7d11057f916b3bbc8816d399e60c4de3722352af

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - blobfile
    - datasets <4.8.0,>=3.6.0
    - einops
    - fsspec
    - pillow
    - python >={{ python_min }}
    - pytorch >=2.3.1
    - sentencepiece
    - spmd-types ==0.3.1
    - tensorboard
    - tiktoken
    - tomli >=1.1.0
    - tokenizers >=0.15.0
    - torchdata >=0.8.0
    - torch-checkpointing ==0.1.1
    - transformers
    - triton
    - tyro
    - tabulate
    - wandb
    - attn-gym ==0.0.17
    - grain ==0.2.18
    - renderers ==0.1.12
    - torch-remat ==0.2.2

test:
  # imports:
  #   - torchtitan
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pytorch/torchtitan
  summary: A PyTorch native platform for training generative AI models
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sarthakpati
